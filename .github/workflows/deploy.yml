name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'cloudflare/**'
      - '.github/workflows/redirect-rules.yml'
      - '.github/workflows/indexnow.yml'
      - 'docs/**'
      - '.kiro/**'
  repository_dispatch:
    types: [dataset_updated]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned versions
        id: v
        run: |
          echo "hugo=$(jq -r .hugo config/build.json)" >> "$GITHUB_OUTPUT"
          echo "go=$(jq -r .go config/build.json)" >> "$GITHUB_OUTPUT"
          echo "node=$(jq -r .node config/build.json)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.v.outputs.node }}
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.v.outputs.go }}

      - name: Install Hugo extended
        run: |
          wget -q -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${{ steps.v.outputs.hugo }}/hugo_extended_${{ steps.v.outputs.hugo }}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Pre-flight version check
        run: |
          hugo version
          hugo version | grep -q "extended"
          hugo version | grep -q "v${{ steps.v.outputs.hugo }}"

      - run: pnpm install --frozen-lockfile

      - name: OG images
        env:
          CFC_WEBHOOK_URL: ${{ vars.CFC_WEBHOOK_URL }}
          HUGO_CFC_WEBHOOK_KEY: ${{ secrets.HUGO_CFC_WEBHOOK_KEY }}
        run: pip3 install -r requirements.txt && python3 scripts/generate_og_images.py

      - name: Build
        env:
          # Enable after turning on Image Transformations (remote sources) for the zone.
          HUGOxPARAMSxCFC_IMAGE_RESIZE: ${{ vars.CFC_IMAGE_RESIZE || 'false' }}
          HUGO_CFC_WEBHOOK_KEY: ${{ secrets.HUGO_CFC_WEBHOOK_KEY }}
        run: pnpm build

      - run: pnpm check-file-count

      - name: Write IndexNow key file
        id: indexnow_key
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::INDEXNOW_KEY secret is not configured; skipping IndexNow."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/indexnow.mjs write-key
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Restore IndexNow state
        if: steps.indexnow_key.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tmp/indexnow-state.json
          key: indexnow-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-state-${{ github.ref_name }}-

      - name: Submit changed URLs to IndexNow
        if: steps.indexnow_key.outputs.enabled == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs submit --soft-fail

      - name: Save IndexNow state
        if: steps.indexnow_key.outputs.enabled == 'true' && hashFiles('.tmp/indexnow-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .tmp/indexnow-state.json
          key: indexnow-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
