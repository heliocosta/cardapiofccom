# Curated broadcaster overlay for CardápioFC Broadcaster Directory.
# Merged at Hugo build time with dataset.channels without altering Data Contract v1.
# Official, licensed broadcasters and streaming services only (zero ads).

denylist:
  slugs:
    - "canal-a-confirmar"
    - "nao-confirmado"
    - "to-be-confirmed"
    - "tba"
    - "unknown"
  namePatterns:
    - "(?i)^(canal a confirmar|não confirmado|nao confirmado|to be confirmed|tba|tbd)$"

normalization:
  stripSuffixes:
    - "(?i)\\s*\\((?:Watch it live|Ver ao vivo|Ver en vivo|Ver en directo|Míralo en vivo|Miralo en vivo|Live)\\)\\s*$"
    - "^\\s+|\\s+$"

