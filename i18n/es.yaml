faq: "FAQ"
faq_badge: "Preguntas Frecuentes"
faq_title: "CardápioFC FAQ — Fútbol en TV y Streaming"
faq_intro: "Todo lo que necesitas saber sobre transmisiones oficiales, servicios de streaming y la app móvil CardápioFC."
faq_q1: "¿Dónde puedo ver los partidos de fútbol en TV y streaming hoy?"
faq_a1: "CardápioFC muestra los canales oficiales y plataformas legales de streaming para cada partido en tu país. Descarga la app móvil CardápioFC para horarios actualizados, filtros de canales y enlaces directos."
faq_q2: "¿CardápioFC transmite los partidos de fútbol en vivo?"
faq_a2: "No. CardápioFC es estrictamente una guía de TV y programación deportiva. No transmitimos ni retransmitimos audio ni video. Promovemos canales y plataformas 100% oficiales y legales."
faq_q3: "¿Qué competiciones y ligas están cubiertas?"
faq_a3: "CardápioFC cubre los principales torneos nacionales, continentales e internacionales, incluidos Brasileirão, Copa Libertadores, Copa Sudamericana, UEFA Champions League, Premier League, LaLiga, Serie A y Copa del Mundo."
faq_q4: "¿Cómo funcionan las alertas y recordatorios de inicio de partido?"
faq_a4: "En la app CardápioFC puedes programar alarmas de notificación antes del partido (por ejemplo, 5, 15 o 30 minutos antes del saque inicial) para cualquier partido o tus equipos favoritos."
faq_q5: "¿La app CardápioFC incluye resultados en vivo y reloj de partido?"
faq_a5: "¡Sí! Mientras nuestro sitio web se enfoca en la guía de TV y streaming, la app CardápioFC incluye resultados en vivo en tiempo real, minutos jugados, penales y eventos minuto a minuto."
faq_q6: "¿Dónde puedo ver estadísticas e historial de enfrentamientos directos?"
faq_a6: "Resultados históricos cara a cara, racha de los equipos, detalles del estadio y estadísticas clave están disponibles en la app CardápioFC."
faq_q7: "¿Están disponibles las tablas de posiciones y llaves de eliminación?"
faq_a7: "Sí. Puedes seguir tablas de posiciones actualizadas en tiempo real, puntos, diferencia de goles, zonas de descenso y cuadros de fases eliminatorias en la app."
faq_q8: "¿Puedo escuchar transmisiones de radio en vivo?"
faq_a8: "Sí. La app CardápioFC incluye transmisiones de audio de radios locales en vivo para seguir los partidos cuando no puedes ver la televisión."
faq_q9: "¿Puedo filtrar los partidos por mis suscripciones de canales?"
faq_a9: "Sí. En los ajustes de la app puedes seleccionar los canales y servicios de streaming que tienes contratados para ver únicamente los partidos que realmente puedes sintonizar."
faq_q10: "¿CardápioFC está disponible para Wear OS y Android TV?"
faq_a10: "¡Sí! Puedes consultar resultados en vivo en tu muñeca con Wear OS o navegar por los partidos cómodamente en la sala con Android TV."
faq_q11: "¿CardápioFC es gratuita para descargar y usar?"
faq_a11: "¡Sí! CardápioFC es 100% gratuita para descargar en el App Store de Apple y en Google Play Store. No se requiere suscripción de pago para ver los horarios."
