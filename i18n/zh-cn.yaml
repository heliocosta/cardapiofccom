about_pillar1_desc: "仅展示合法授权电视台与流媒体服务，无弹窗广告，无盗播链接，安全可靠。"
about_pillar2_title: "网页端零广告、极速加载"
about_pillar2_desc: "我们相信查赛程只需几秒钟。网页端零干扰广告，加载飞快。"
about_pillar3_title: "按国家定制赛程"
about_pillar3_desc: "不同国家转播权不同。CardápioFC 按地区自动匹配当地时区与转播频道，覆盖巴西、英国、爱尔兰、葡萄牙、阿根廷、美国、中国与日本。"
about_pillar4_title: "支持正版足球生态"
about_pillar4_desc: "引导球迷使用持牌转播平台，远离危险的非法盗播网站。"
