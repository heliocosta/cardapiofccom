about_title: "您的足球观赛菜单：合法观看足球赛事"
about_intro: "CardápioFC 的初衷很简单：帮助球迷准确找到转播喜爱球队的官方电视频道与流媒体服务，无垃圾信息、无盗播，清晰直观。"
about_story_title: "为什么打造 CardápioFC？"
about_story_p1: "每位球迷都经历过：比赛即将开始，却要在无数网页、社交媒体和不可靠链接中到处查找哪里能看直播。"
about_story_p2: "随着转播权分散在免费电视、付费有线台和众多流媒体平台，找到正确渠道越来越难。CardápioFC 用干净、准确且持续更新的节目单为您化繁为简。"
about_story_p3: "我们的网站专注于赛程指南，简洁快速；手机应用则提供赛前提醒、实时比分、一键跳转及球队订阅通知。"
