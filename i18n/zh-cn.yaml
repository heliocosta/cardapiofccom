faq_title: "CardápioFC 常见问题：足球电视与流媒体观赛指南"
faq_intro: "关于官方足球转播、流媒体平台及 CardápioFC 手机应用的一切解答。"
faq_q1: "今天在哪里可以通过电视和流媒体观看足球比赛？"
faq_a1: "CardápioFC 为您展示所在国家/地区每场比赛的官方电视频道和合法流媒体平台。下载 CardápioFC 手机应用，获取实时赛程更新、频道筛选及流媒体直达链接。"
faq_q2: "CardápioFC 会直接直播足球比赛吗？"
faq_a2: "不会。CardápioFC 仅提供赛事转播时间表与频道指南，不托管、不直播也不转播任何音视频内容，仅推荐 100% 官方授权的电视台与合法流媒体平台。"
faq_q3: "覆盖哪些赛事和联赛？"
faq_a3: "CardápioFC 覆盖全球主要国内联赛、洲际杯赛及国际赛事，包括欧冠、英超、西甲、意甲、德甲、法甲、巴甲、美职联、解放者杯、世界杯及预选赛等。"
faq_q4: "开球提醒和通知是如何工作的？"
faq_a4: "在 CardápioFC 手机应用中，您可以为特定比赛或关注球队设置赛前提醒（如开球前 5、15 或 30 分钟），不再错过任何开球。"
faq_q5: "CardápioFC 应用包含实时比分和比赛计时吗？"
faq_a5: "是的！网站专注于电视与流媒体转播赛程，而手机应用还提供实时比分、比赛分钟数、点球大战及进球/红黄牌/VAR 等实时事件。"
faq_q6: "在哪里可以查看历史交锋与球队状态？"
faq_a6: "在 CardápioFC 手机应用中可以查看双方交锋记录、近期战绩、球场信息及关键比赛数据。"
faq_q7: "是否提供实时积分榜和淘汰赛对阵图？"
faq_a7: "是的，您可以直接在应用中查看实时更新的联赛积分榜、净胜球及杯赛淘汰赛对阵图。"
faq_q8: "可以收听实时广播解说吗？"
faq_a8: "可以。CardápioFC 手机应用内置多场赛事的本地广播音频流，方便您无法看电视时收听。"
faq_q9: "可以按我订阅的频道筛选比赛吗？"
faq_a9: "可以。在应用设置中勾选您已订阅的电视频道和流媒体服务，CardápioFC 会高亮显示您可以观看的比赛。"
faq_q10: "CardápioFC 支持 Wear OS 和 Android TV 吗？"
faq_a10: "支持！您可以使用 Wear OS 手表端查看实时比分，或通过 Android TV 在客厅大屏浏览赛程。"
faq_q11: "CardápioFC 可以免费下载和使用吗？"
faq_a11: "可以！CardápioFC 可在 Apple App Store 和 Google Play 免费下载，无需付费订阅即可查看赛程。"
