faq: "FAQ"
faq_badge: "Frequently Asked Questions"
faq_title: "CardápioFC FAQ — Watch Football on TV & Streaming"
faq_intro: "Everything you need to know about official football broadcasts, streaming services, and the CardápioFC mobile app."
faq_q1: "Where can I watch football matches on TV and streaming today?"
faq_a1: "CardápioFC displays official broadcast channels and legal streaming platforms for every match in your country. Download the CardápioFC mobile app for real-time schedule updates, channel filters, and instant links to streaming services."
faq_q2: "Does CardápioFC stream live football matches?"
faq_a2: "No. CardápioFC is strictly an informational TV guide and broadcast schedule. We do not host, stream, or retransmit any audio or video. We promote 100% official, licensed broadcasters and legal streaming platforms (such as TV Globo, SporTV, ESPN, TNT Sports, Prime Video, Disney+, Max, Sky Sports, and BBC)."
faq_q3: "Which competitions and leagues are covered?"
faq_a3: "CardápioFC covers major domestic, continental, and international tournaments including the Brasileirão (Série A to D), Copa do Brasil, State Championships, Copa Libertadores, Copa Sudamericana, UEFA Champions League, Premier League, LaLiga, Serie A, Bundesliga, Ligue 1, MLS, FIFA World Cup, and continental qualifiers."
faq_q4: "How do kick-off reminders and alerts work?"
faq_a4: "In the CardápioFC mobile app, you can set pre-match notification alarms (e.g. 5, 15, or 30 minutes before kick-off) for any specific match or your favourite teams, so you never miss a match start."
faq_q5: "Does the CardápioFC app include live scores and match clocks?"
faq_a5: "Yes! While our website focuses purely on the TV and streaming schedule, the CardápioFC mobile app features real-time live scores, elapsed minutes, penalty shootouts, and minute-by-minute timeline events (goals, cards, VAR decisions)."
faq_q6: "Where can I view confirmed pitch lineups and formations?"
faq_a6: "Confirmed starting XIs, tactical formations on an interactive pitch, jersey numbers, and bench substitutes are available inside the CardápioFC mobile app as soon as official teams announce them."
faq_q7: "What is the Interactive Lineup Builder?"
faq_a7: "The app includes an interactive tactical board where you can build your dream starting XI, position players on the pitch, and share your formation image directly with friends on WhatsApp or social media."
faq_q8: "Can I listen to live radio commentary?"
faq_a8: "Yes. The CardápioFC mobile app includes live local radio audio streams for matches, letting you listen to exciting commentary on the go when you cannot watch on TV."
faq_q9: "Can I filter matches by my active subscriptions?"
faq_a9: "Yes. In the mobile app settings, you can select the TV channels and streaming services you subscribe to. CardápioFC will filter your match schedule to only highlight games you can actually watch."
faq_q10: "Is CardápioFC available on Wear OS and Android TV?"
faq_a10: "Yes! You can check live scores on your wrist with our Wear OS companion app, or browse upcoming fixtures comfortably on your living room television using Android TV."
faq_q11: "Is CardápioFC free to download and use?"
faq_a11: "Yes! CardápioFC is 100% free to download on the Apple App Store and Google Play Store. No paid subscriptions are required to view the match schedules."
