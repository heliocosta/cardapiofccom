about_story_p2: "地上波、CS/BS、複数の動画配信サービスに放映権が分かれる中、正確で分かりやすい放送予定表を提供します。"
about_story_p3: "ウェブサイトは軽快なスケジュール閲覧に特化し、モバイルアプリでは通知アラーム、ライブスコア、配信リンク連携を提供しています。"
