about_pillar2_title: "高速表示で快適な閲覧"
about_pillar2_desc: "見たい試合の放送情報を数秒で確認できるよう、軽量で高速な読み込みを実現しています。"
about_pillar3_title: "国・地域別スケジュール"
about_pillar3_desc: "放映権は国ごとに異なります。ブラジル、イギリス、アイルランド、ポルトガル、アルゼンチン、アメリカ、中国、日本など地域に合わせて時差やチャンネルを最適化します。"
