app_feat_1_title: "公式視聴チャンネルを即座に確認"
app_feat_1_desc: "お住まいの地域でどのテレビ局・公式動画配信サービスが中継するかをすぐに確認できます。"
app_feat_2_title: "リアルタイムスコア＆経過時間"
app_feat_2_desc: "ライブスコア、経過時間、前半・試合終了、PK戦の状況をリアルタイムで追えます。"
app_feat_3_title: "ワンタップで公式配信アプリを起動"
app_feat_3_desc: "試合ページのチャンネルをタップして、公式配信サービスやアプリへ直接移動できます。"
app_feat_4_title: "日別サッカー放送メニュー"
app_feat_4_desc: "昨日・今日・明日・今後の試合日程を日付ごとに切り替えて週間予定を把握できます。"
app_feat_5_title: "カスタムキックオフ通知"
app_feat_5_desc: "試合開始5分・15分・30分前のリマインダーや応援チームのプッシュ通知を設定できます。"
app_feat_6_title: "お気に入り＆マイカレンダー"
app_feat_6_desc: "応援するクラブやリーグ、視聴チャンネルを登録して観戦予定を管理できます。"
app_feat_7_title: "対戦成績・チーム統計"
app_feat_7_desc: "直近のチーム状態、過去の対戦成績、スタジアム情報を試合前後にチェックできます。"
app_feat_8_title: "順位表・トーナメント表"
app_feat_8_desc: "最新のリーグ順位表、勝ち点、得失点差、カップ戦の勝ち上がり表を確認できます。"
app_feat_9_title: "海外エディション切替・大画面対応"
app_feat_9_desc: "Wear OS や Android TV に対応し、海外滞在時も地域の放送予定へ切り替えられます。"
