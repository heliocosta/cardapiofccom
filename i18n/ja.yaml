faq: "よくある質問"
faq_badge: "FAQ"
faq_title: "CardápioFC よくある質問：サッカー放送・配信ガイド"
faq_intro: "公式サッカー放送、ネット配信サービス、CardápioFC モバイルアプリについてのよくある質問。"
faq_q1: "今日のサッカーの試合はどこでテレビやネット配信を見られますか？"
faq_a1: "CardápioFC では、お住まいの地域の公式テレビ局と正規配信サービスを試合ごとに案内しています。CardápioFC アプリをダウンロードすると、最新スケジュールやチャンネル絞り込み、配信ページへのリンクを利用できます。"
faq_q2: "CardápioFC は試合をライブ配信していますか？"
faq_a2: "いいえ。CardápioFC は放送スケジュール案内サイトであり、映像・音声の配信や再送信は一切行いません。正規の放送局および公式配信サービスのみを案内しています。"
faq_q3: "どの大会やリーグに対応していますか？"
faq_a3: "チャンピオンズリーグ、プレミアリーグ、ラ・リーガ、セリエA、ブンデスリーガ、リーグ・アン、ブラジル全国選手権、MLS、ワールドカップ予選など国内外の主要大会に対応しています。"
faq_q4: "キックオフ通知・リマインダーはどのように使えますか？"
faq_a4: "CardápioFC アプリでは、気になる試合や応援するチームのキックオフ5分・15分・30分前に通知を受け取ることができます。"
faq_q5: "アプリではライブスコアや経過時間も確認できますか？"
faq_a5: "はい。ウェブサイトは放送スケジュールに特化していますが、モバイルアプリではリアルタイムスコアや経過時間、得点・カード・VAR などの速報も確認できます。"
faq_q6: "対戦成績やチームの調子はどこで確認できますか？"
faq_a6: "過去の対戦成績、直近フォーム、スタジアム情報、試合データは CardápioFC アプリ内で確認できます。"
faq_q7: "順位表やトーナメント表は見られますか？"
faq_a7: "はい、最新のリーグ順位表やカップ戦のトーナメント表をアプリ内で直接確認できます。"
faq_q8: "ラジオ実況は聴けますか？"
faq_a8: "はい。アプリでは試合の現地ラジオ実況音声にも対応しています。"
faq_q9: "契約している配信サービスだけで試合を絞り込めますか？"
faq_a9: "はい。アプリの設定で契約中のテレビ・配信サービスを選択すると、視聴可能な試合を優先表示できます。"
faq_q10: "Wear OS や Android TV に対応していますか？"
faq_a10: "はい。Wear OS でライブスコアを確認したり、Android TV でテレビの大画面から試合予定を探したりできます。"
faq_q11: "CardápioFC は無料で使えますか？"
faq_a11: "はい。App Store および Google Play から無料でダウンロードでき、試合スケジュールの閲覧に課金は不要です。"
