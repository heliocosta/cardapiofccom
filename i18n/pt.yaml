faq_badge: "Perguntas Frequentes"
faq_title: "CardápioFC FAQ — Futebol na TV e Streaming"
faq_intro: "Tudo o que você precisa saber sobre transmissões oficiais, serviços de streaming e o aplicativo CardápioFC."
faq_q1: "Onde posso assistir aos jogos de futebol na TV e streaming hoje?"
faq_a1: "O CardápioFC mostra os canais oficiais e plataformas legais de streaming para cada partida no seu país. Baixe o app CardápioFC para atualizações em tempo real, filtros de canais e links diretos para streaming."
faq_q2: "O CardápioFC transmite os jogos de futebol ao vivo?"
faq_a2: "Não. O CardápioFC é estritamente um guia de TV e programação esportiva. Não hospedamos, transmitimos nem retransmitimos áudio ou vídeo. Promovemos emissoras 100% oficiais e legais (como TV Globo, SporTV, Premiere, ESPN, CazéTV, Prime Video, Disney+, Max)."
faq_q3: "Quais campeonatos e ligas são cobertos?"
faq_a3: "O CardápioFC cobre os principais torneios nacionais, continentais e internacionais, incluindo Brasileirão (Séries A a D), Copa do Brasil, Estaduais, Copa Libertadores, Copa Sul-Americana, Champions League, Premier League, LaLiga, Serie A, Bundesliga, Copa do Mundo e mais."
faq_q4: "Como funcionam os alarmes e lembretes de início do jogo?"
faq_a4: "No app CardápioFC, você pode definir alarmes de notificação pré-jogo (ex.: 5, 15 ou 30 minutos antes do apito inicial) para qualquer partida ou seus times favoritos."
faq_q5: "O app CardápioFC inclui placar ao vivo e tempo de jogo?"
faq_a5: "Sim! Enquanto nosso site foca na programação de TV e streaming, o aplicativo CardápioFC oferece placar ao vivo em tempo real, minutos jogados, pênaltis e linha do tempo minuto a minuto."
faq_q6: "Onde posso ver as escalações confirmadas no campo?"
faq_a6: "Escalações titulares confirmadas, formações táticas em campinho 2D interativo, números de camisa e reservas estão disponíveis no app CardápioFC assim que divulgadas."
faq_q7: "O que é o Montador de Escalação Interativo?"
faq_a7: "O app conta com uma prancheta tática interativa onde você pode montar sua escalação dos sonhos, posicionar jogadores no campo e compartilhar a imagem da formação com amigos no WhatsApp ou redes sociais."
faq_q8: "Posso ouvir narração de rádio ao vivo?"
faq_a8: "Sim. O aplicativo CardápioFC inclui transmissões de áudio de rádios locais ao vivo, permitindo acompanhar a emoção do jogo quando não puder assistir à TV."
faq_q9: "Posso filtrar os jogos pelas minhas assinaturas de canais?"
faq_a9: "Sim. Nas configurações do aplicativo, você pode marcar os canais e serviços de streaming que assina para ver apenas os jogos que você realmente pode assistir."
faq_q10: "O CardápioFC está disponível para Wear OS e Android TV?"
faq_a10: "Sim! Você pode ver placares ao vivo no seu pulso pelo Wear OS ou navegar pela programação diretamente na televisão com o Android TV."
faq_q11: "O CardápioFC é gratuito para baixar e usar?"
faq_a11: "Sim! O CardápioFC é 100% gratuito para baixar na App Store da Apple e na Google Play Store. Nenhuma assinatura paga é necessária para ver os horários dos jogos."
