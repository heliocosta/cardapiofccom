######################## default configuration ####################
# The base URL of your site (required). This will be prepended to all relative URLs.
baseURL = "https://cardapiofc.com/"
# Title of your website (required).
title = "CardápioFC"
# Your theme name
theme = "hugoplate"
# Default time zone for time stamps; use any valid tz database name: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
timeZone = "UTC"
# post excerpt
summaryLength = 10 # see https://gohugo.io/content-management/summaries/#automatic-summary
# disable language
disableLanguages = []
hasCJKLanguage = false
# default language
defaultContentLanguage = "en"
# defaultContentLanguageInSubdir need to be true if you want to use the language code as a subdirectory and language specific 404 page
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = true
disableKinds = ["taxonomy", "term", "RSS"]

########################### Services #############################
[services]
[services.googleAnalytics]
ID = 'G-MEASUREMENT_ID' # see https://gohugo.io/templates/internal/#configure-google-analytics

########################## Permalinks ############################
[permalinks.page]
"pages" = "/:slugorcontentbasename/"


########################## Pagination ############################
[pagination]
disableAliases = false
pagerSize = 10
path = 'page'


############################# Build ##############################
[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

############################# Modules ############################
[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'
[[module.mounts]]
source = "i18n/en.yaml"
target = "i18n/en-gb.yaml"
[[module.mounts]]
source = "i18n/en.yaml"
target = "i18n/en-ie.yaml"
[[module.mounts]]
source = "i18n/pt.yaml"
target = "i18n/pt-br.yaml"
[[module.mounts]]
source = "i18n/pt.yaml"
target = "i18n/pt-pt.yaml"
[[module.mounts]]
source = "i18n/es.yaml"
target = "i18n/es-ar.yaml"
[[module.mounts]]
source = "i18n"
target = "i18n"


############################# Outputs ############################
[outputs]
home     = ["HTML", "WebAppManifest", "llms", "llmsfull"]
page     = ["HTML"]
section  = ["HTML"]

############################# Imaging ############################
[imaging]
# See https://github.com/disintegration/imaging
resampleFilter = "Lanczos"
[imaging.jpeg]
quality = 80
[imaging.webp]
quality = 80

############################ Caches ##############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.getresource]
dir = ":cacheDir/:project"
maxAge = "720h"


############################ Markup ##############################
[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = 'monokai' # see https://xyproto.github.io/splash/docs/all.html
lineNumbersInTable = false

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = true


########################### Media types ###########################
[mediaTypes]
[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]


########################### Output Format ##########################
[outputFormats]
[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
rel = "manifest"


############################# Plugins ##############################

# CSS Plugins
[[params.plugins.css]]
link = "css/cfc/lazy.css"
lazy = true

# JS Plugins
[[params.plugins.js]]
link = "js/cfc-lazy.js"
lazy = true
